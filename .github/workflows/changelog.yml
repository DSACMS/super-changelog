name: Generate Changelog

on:
    schedule:
        - cron: '0 0 * * 5'
    workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  generate-weekly-data:
    runs-on: ubuntu-latest
    outputs:
      weekly_file: ${{ steps.weekly.outputs.weekly_file }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Generate app token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub

      - name: Generate weekly changelog
        id: weekly
        env:
          GH_APP_ID: ${{ vars.APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GH_APP_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          GH_FALLBACK_PAT: ${{ secrets.GH_FALLBACK_PAT }}
        run: |
          python scripts/generate_changelog_weekly.py
      
      - name: Generate full summary
        run: |
          python scripts/generate_summary.py
      
      - name: Generate condensed summary
        run: |
          python scripts/generate_summary_condensed.py

      - name: Upload summary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weekly-changelog-summaries
          path: |
            changelog_data/summaries/

      - name: Upload weekly json artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-changelog-json
          path: ${{ steps.weekly.outputs.weekly_file }}
          if-no-files-found: error

  create-full-summary-pr:
    needs: generate-weekly-data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate app token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub

      - name: Download summary artifacts
        uses: actions/download-artifact@v4
        with:
          name: weekly-changelog-summaries
          path: changelog_data/summaries/

      - name: Download weekly json artifact
        uses: actions/download-artifact@v4
        with:
          name: weekly-changelog-json
          path: changelog_data/data/

      - name: Create Pull Request with Full Summary
        env: 
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Get latest summary files
          TIMESTAMP=$(date +"%Y-%m-%d")
          PR_TITLE_FILE="changelog_data/summaries/pr_title_${TIMESTAMP}.txt"
          PR_BODY_FILE="changelog_data/summaries/pr_body_${TIMESTAMP}.md"

          if [ ! -f "$PR_TITLE_FILE" ] || [ ! -f "$PR_BODY_FILE" ]; then
            echo "::error::Expected $PR_TITLE_FILE and $PR_BODY_FILE but they were not found"
            ls changelog_data/summaries/ | head -n 50
            exit 1
          fi

          if [ -f "$PR_TITLE_FILE" ] && [ -f "$PR_BODY_FILE" ]; then
            PR_TITLE=$(cat "$PR_TITLE_FILE")

            BRANCH_NAME="weekly-changelog-$(date +"%Y-%m-%d")"

            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action" 
            
            if git ls-remote --exit-code --heads origin "$BRANCH_NAME"; then
              echo "Branch $BRANCH_NAME exists, updating..."
              git fetch origin "$BRANCH_NAME"
              git checkout "$BRANCH_NAME"
              git pull origin "$BRANCH_NAME"
            else
              echo "Creating new branch $BRANCH_NAME ..."
              git checkout -b "$BRANCH_NAME"
            fi

            git add changelog_data/
            if git diff-index --quiet HEAD --; then
              echo "No changes to commit"
            else
              git commit -sm "Add weekly changelog summary for $(date +"%Y-%m-%d")"
              git push --set-upstream origin "$BRANCH_NAME"
            fi

            if ! gh pr view "$BRANCH_NAME" --json number 2>/dev/null; then
              gh api repos/${{ github.repository }}/labels -f name='changelog' -f color='0E8A16' || true
              gh api repos/${{ github.repository }}/labels -f name='automated' -f color='FB04D4' || true

              gh pr create \
                --title "$PR_TITLE" \
                --body-file "$PR_BODY_FILE" \
                --base main \
                --head "$BRANCH_NAME" \
                --label "changelog,automated" || \
                gh pr create \
                  --title "$PR_TITLE" \
                  --body-file "$PR_BODY_FILE" \
                  --base main \
                  --head "$BRANCH_NAME"
            else
              echo "PR already exists for $BRANCH_NAME"
            fi
          else
            echo "Could not find PR title or body files"
            exit 1
          fi

  create-condensed-summary-pr:
    needs: generate-weekly-data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate app token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub

      - name: Download summary artifacts
        uses: actions/download-artifact@v4
        with:
          name: weekly-changelog-summaries
          path: changelog_data/summaries/

      - name: Download weekly json artifact
        uses: actions/download-artifact@v4
        with:
          name: weekly-changelog-json
          path: changelog_data/data/

      - name: Create Condensed Pull Request
        env: 
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Get latest condensed summary files
          TIMESTAMP=$(date +"%Y-%m-%d")
          PR_TITLE_FILE="changelog_data/summaries/pr_title_condensed_${TIMESTAMP}.txt"
          PR_BODY_FILE="changelog_data/summaries/pr_body_condensed_${TIMESTAMP}.md"

          if [ ! -f "$PR_TITLE_FILE" ] || [ ! -f "$PR_BODY_FILE" ]; then
            echo "::error::Expected $PR_TITLE_FILE and $PR_BODY_FILE but they were not found"
            ls changelog_data/summaries/ | head -n 50
            exit 1
          fi

          if [ -f "$PR_TITLE_FILE" ] && [ -f "$PR_BODY_FILE" ]; then
            PR_TITLE=$(cat "$PR_TITLE_FILE")

            BRANCH_NAME="weekly-changelog-condensed-$(date +"%Y-%m-%d")"

            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"

            if git ls-remote --exit-code --heads origin "$BRANCH_NAME"; then
              echo "Branch $BRANCH_NAME exists, updating..."
              git fetch origin "$BRANCH_NAME"
              git checkout "$BRANCH_NAME"
              git pull origin "$BRANCH_NAME"
            else
              echo "Creating new branch..."
              git checkout -b "$BRANCH_NAME"
            fi

            git add changelog_data/
            if git diff-index --quiet HEAD --; then
              echo "No changes to commit"
            else
              git commit -sm "Add weekly condensed changelog summary for $(date +"%Y-%m-%d")"
              git push origin "$BRANCH_NAME"
            fi

            if ! gh pr view "$BRANCH_NAME" --json number 2>/dev/null; then
              gh api repos/${{ github.repository }}/labels -f name='changelog' -f color='0E8A16' || true
              gh api repos/${{ github.repository }}/labels -f name='automated' -f color='FB04D4' || true
              gh api repos/${{ github.repository }}/labels -f name='condensed' -f color='FFD700' || true

              gh pr create \
                --title "$PR_TITLE" \
                --body-file "$PR_BODY_FILE" \
                --base main \
                --head "$BRANCH_NAME" \
                --label "changelog,automated,condensed" || \
                gh pr create \
                  --title "$PR_TITLE" \
                  --body-file "$PR_BODY_FILE" \
                  --base main \
                  --head "$BRANCH_NAME"
            else
              echo "PR already exists for $BRANCH_NAME"
            fi
          else
            echo "Could not find PR title or body files"
            exit 1
          fi

  push-weekly-json-to-metrics-data:
    needs: generate-weekly-data
    runs-on: ubuntu-latest

    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: metrics-data

      - name: Checkout metrics-data repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/metrics-data
          token: ${{ steps.app-token.outputs.token }}
          path: metrics-data

      - name: Download weekly json artifact
        uses: actions/download-artifact@v4
        with:
          name: weekly-changelog-json
          path: incoming/

      - name: Copy weekly changelog json into metrics-data
        env:
          EXPECTED_FILE: ${{ needs.generate-weekly-data.outputs.weekly_file }}
        run: |
          if [ -z "$EXPECTED_FILE" ]; then
            echo "::error::generate-weekly-data did not report a weekly file name"
            exit 1
          fi

          EXPECTED_NAME=$(basename "$EXPECTED_FILE")
          SRC_FILE="incoming/$EXPECTED_NAME"

          if [[ ! "$EXPECTED_NAME" =~ ^weekly_changelog_[0-9]{4}-[0-9]{2}-[0-9]{2}_to_[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$ ]]; then
            echo "::error::Unexpected file name: $EXPECTED_NAME"
            exit 1
          fi

          COUNT=$(find incoming -maxdepth 1 -name 'weekly_changelog_*.json' | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected exactly 1 weekly json in artifact, found $COUNT"
            exit 1
          fi

          if [ ! -f "$SRC_FILE" ]; then
            echo "::error::Expected $EXPECTED_NAME but it is not in the artifact"
            exit 1
          fi

          python3 -m json.tool "$SRC_FILE" > /dev/null || {
            echo "::error::$EXPECTED_NAME is not valid JSON"
            exit 1
          }

          mkdir -p metrics-data/data
          cp "$SRC_FILE" metrics-data/data/
          echo "Copied $EXPECTED_NAME"

      - name: Commit and push directly to main
        working-directory: metrics-data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add data/
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit"
          else
            git commit -sm "Add weekly changelog data for $(date +"%Y-%m-%d")"
            git push origin HEAD:main
          fi